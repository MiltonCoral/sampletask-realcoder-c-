<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopLocal - Checkout</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="/" class="logo">ShopLocal</a>
            <nav class="main-nav">
                <a href="/">Shop</a>
                <a href="/cart.html">Cart (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Checkout</h1>
        <div class="checkout-layout">
            <form id="checkout-form" class="checkout-form">
                <h2>Shipping Information</h2>
                <div class="form-group">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="customerName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="customerEmail" required>
                </div>
                <div class="form-group">
                    <label for="address">Shipping Address</label>
                    <textarea id="address" name="shippingAddress" rows="3" required></textarea>
                </div>
                <div id="checkout-error" class="error-message"></div>
                <button type="submit" class="btn btn-primary btn-block">Place Order</button>
            </form>
            <div class="checkout-summary">
                <h2>Order Summary</h2>
                <div id="checkout-items" class="checkout-items"></div>
                <div class="summary-row"><span>Subtotal:</span><span id="checkout-subtotal">$0.00</span></div>
                <div class="summary-row"><span>Tax (8%):</span><span id="checkout-tax">$0.00</span></div>
                <div class="summary-row total"><span>Total:</span><span id="checkout-total">$0.00</span></div>
            </div>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>

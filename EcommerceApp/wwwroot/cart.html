<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopLocal - Shopping Cart</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="/" class="logo">ShopLocal</a>
            <nav class="main-nav">
                <a href="/">Shop</a>
                <a href="/cart.html">Cart (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1>Shopping Cart</h1>
        <div id="cart-content">
            <div id="cart-items" class="cart-items"></div>
            <div class="cart-summary">
                <div class="summary-row"><span>Subtotal:</span><span id="subtotal">$0.00</span></div>
                <div class="summary-row"><span>Tax (8%):</span><span id="tax">$0.00</span></div>
                <div class="summary-row total"><span>Grand Total:</span><span id="grand-total">$0.00</span></div>
                <a href="/checkout.html" class="btn btn-primary btn-block">Proceed to Checkout</a>
            </div>
        </div>
        <div id="empty-cart" class="empty-state" style="display:none;">
            <p>Your cart is empty.</p>
            <a href="/" class="btn">Continue Shopping</a>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>

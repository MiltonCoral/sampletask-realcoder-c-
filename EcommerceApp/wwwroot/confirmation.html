<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopLocal - Order Confirmed</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="/" class="logo">ShopLocal</a>
            <nav class="main-nav">
                <a href="/">Shop</a>
                <a href="/cart.html">Cart (<span id="cart-count">0</span>)</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="confirmation-box">
            <h1>Order Confirmed!</h1>
            <p class="confirmation-message">Thank you for your purchase. Your order has been placed successfully.</p>
            <div class="confirmation-details">
                <div class="detail-row"><span>Order ID:</span><span id="order-id">-</span></div>
                <div class="detail-row"><span>Email:</span><span id="order-email">-</span></div>
                <div class="detail-row"><span>Total:</span><span id="order-total">-</span></div>
                <div class="detail-row"><span>Date:</span><span id="order-date">-</span></div>
            </div>
            <a href="/" class="btn btn-primary">Continue Shopping</a>
        </div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
